[package]
name = "croustypatch-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
actix-cors = "0.7.2"
actix-files = "0.7.4"
actix-web = { version = "4.18.2", features = ["rustls-0_23"] }
actix-ws = "0.4.0"
aes-gcm = "0.10"
anyhow = "1.0.104"
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
croustypatch-common = { version = "0.6.0", path = "../common" }
diesel = { version = "2.3.14", features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots", "aws-lc-rs"] }
pq-sys = { version = "0.7.8", features = ["bundled_without_openssl"] }
rand = "0.8"
rcgen = "0.14.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zeroize = "1.9.1"

[dev-dependencies]
actix-http = "3.20.3"
tempfile = "3.27.0"
