  <button class="cs-btn cs-btn--primary cs-btn--lg">Large</button>

  <button class="cs-btn cs-btn--primary cs-btn--sm">Small</button>

<p class="sec">States</p>
<div class="cs-row blk">
  <button class="cs-btn">Rest</button>
  <button class="cs-btn is-hover">Hover</button>
  <button class="cs-btn is-active">Pressed</button>
  <button class="cs-btn is-focus">Focus</button>
  <button class="cs-btn" disabled>Disabled</button>
  <button class="cs-btn cs-btn--primary" aria-busy="true"><span class="cs-spinner" aria-hidden="true"></span> Deploying</button>
</div>
<p class="sec">Dark theme</p>
<div data-theme="dark" class="cs-theme">
<div class="cs-row">
  <button class="cs-btn cs-btn--primary">Deploy</button>
  <button class="cs-btn">Cancel</button>
  <button class="cs-btn cs-btn--ghost">View logs</button>
  <button class="cs-btn cs-btn--danger">Delete</button>
  <button class="cs-btn" disabled>Disabled</button>
</div>
</div>

</html>
