# CroustyPatch behind a reverse proxy (TLS 1.3 terminated by the proxy).
# Stack directory convention: /opt/stacks/croustypatch/{compose.yaml,.env}
#
# .env must define:
#   CROUSTYPATCH_DB_PASSWORD         database password
#   CROUSTYPATCH_MASTER_KEY          base64, 32 bytes (openssl rand -base64 32): BACK IT UP SEPARATELY
#   CROUSTYPATCH_TRUSTED_PROXIES     address(es) of the reverse proxy, comma separated
#   CROUSTYPATCH_BOOTSTRAP_PASSWORD  one-time first-login password for the "admin" account (>= 12 chars)
#   CROUSTYPATCH_IMAGE               image to run (default croustypatch-server:0.3.2)
#   PORT                             host port the proxy forwards to (default 3000)
name: croustypatch

services:
  server:
    image: ${CROUSTYPATCH_IMAGE:-croustypatch-server:0.3.2}
    restart: unless-stopped
    hostname: croustypatch-server
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://croustypatch:${CROUSTYPATCH_DB_PASSWORD}@database:5432/croustypatch
      CROUSTYPATCH_MASTER_KEY: ${CROUSTYPATCH_MASTER_KEY:?set CROUSTYPATCH_MASTER_KEY}
      CROUSTYPATCH_BOOTSTRAP_PASSWORD: ${CROUSTYPATCH_BOOTSTRAP_PASSWORD:-}
      # The reverse proxy terminates TLS. Forwarded headers are honoured ONLY from these peers.
      CROUSTYPATCH_TLS_MODE: proxy
      CROUSTYPATCH_LISTEN: 0.0.0.0:${PORT:-3000}
      CROUSTYPATCH_TRUSTED_PROXIES: ${CROUSTYPATCH_TRUSTED_PROXIES:?set CROUSTYPATCH_TRUSTED_PROXIES}
      TZ: Europe/Paris
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - serverdata:/var/lib/croustypatch
    networks:
      - croustypatch-internal
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      # The image has no curl; bash can speak HTTP well enough for a liveness probe.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${PORT:-3000} && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"ok\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: croustypatch
      POSTGRES_PASSWORD: ${CROUSTYPATCH_DB_PASSWORD:?set CROUSTYPATCH_DB_PASSWORD}
      POSTGRES_DB: croustypatch
      TZ: Europe/Paris
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - croustypatch-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croustypatch -d croustypatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  serverdata:

networks:
  croustypatch-internal:
    driver: bridge
